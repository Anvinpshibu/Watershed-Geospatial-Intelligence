[package]
name = "watershed-core"
version = "0.1.0"
edition = "2021"
description = "High-performance geospatial computation, EXIF evidence parsing, raster index generation, and multimodal evidence fusion for watershed intelligence"
authors = ["Watershed Geospatial Intelligence Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
